name: Test

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7.17", "3.11.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache pyenv and Python
        id: cache-pyenv
        uses: actions/cache@v4
        with:
          path: ~/.pyenv
          key: ${{ runner.os }}-pyenv-${{ matrix.python-version }}

      - name: Cache pip
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pyright
        id: cache-pyright
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyright-python
          key: ${{ runner.os }}-pyright-python-v1

      - name: Install pyenv and build dependencies
        run: |
          if [ "${{ steps.cache-pyenv.outputs.cache-hit }}" = "true" ]; then
            echo "Python is already cached. Skipping build dependency installation!"
          else
            echo "Cache miss. Installing build dependencies..."
            sudo apt-get update
            sudo apt-get install -y \
              build-essential zlib1g-dev libssl-dev libbz2-dev \
              libreadline-dev libsqlite3-dev libffi-dev liblzma-dev \
              libncurses5-dev libncursesw5-dev libgdbm-dev uuid-dev \
              curl cmake git wget

            # Only run the installer if the directory wasn't restored from cache
            if [ ! -d "$HOME/.pyenv" ]; then
              curl https://pyenv.run | bash
            fi
          fi

      - name: Install Python ${{ matrix.python-version }}
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          # The -s flag tells pyenv to skip compilation if the version is already installed via cache
          pyenv install -s ${{ matrix.python-version }}
          pyenv global ${{ matrix.python-version }}
          python --version

      - name: Clone and build grug-tests
        run: |
          git clone https://github.com/grug-lang/grug-tests
          cd grug-tests
          git checkout main
          export ASAN=1
          cmake -S . -B build
          cmake --build build

      - name: Clone and build grug-bench
        run: |
          git clone https://github.com/grug-lang/grug-bench
          cd grug-bench
          git checkout master
          cmake -S . -B build
          cmake --build build

      - name: Run Pyright (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pyenv global ${{ matrix.python-version }}
          python --version

          pip install --upgrade pip --user
          pip install pyright pytest coverage --user

          if [[ "${{ matrix.python-version }}" == "3.7.17" ]]; then
            pip install tomli importlib-metadata --user
          fi

          pip install -e .[dev]

          PY_MAJOR_MINOR=$(python - <<'EOF'
          import sys
          print(f"{sys.version_info.major}.{sys.version_info.minor}")
          EOF
          )

          pyright --pythonversion "$PY_MAJOR_MINOR"

      - name: Run grug-tests tests (Python ${{ matrix.python-version }})
        run: |
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so) ASAN_OPTIONS="detect_leaks=0"
          coverage run -m pytest --grug-tests-path=./grug-tests -s -v

      - name: Run grug-bench tests (Python ${{ matrix.python-version }})
        run: |
          coverage run --append benchmarks.py --grug-bench-path=./grug-bench

      - name: Run grug-for-python tests (Python ${{ matrix.python-version }})
        run: |
          python tests.py

      - name: Report coverage (Python ${{ matrix.python-version }})
        run: |
          coverage report -m --fail-under=100

      - name: Generate coverage badge
        if: matrix.python-version == '3.11.9'
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"
          pyenv global 3.11.9

          pip install -U coverage-badge --user

          # Generate badge
          coverage-badge -f -o .github/badges/coverage.svg

          # Configure Git for committing changes
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit & push only if the badge changed
          git add .github/badges/coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/grug-lang/grug-for-python.git HEAD:${{ github.ref_name }}
          else
            echo "No changes to coverage.svg"
          fi

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Build distribution
      run: |
        python -m pip install build
        python -m build
        
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
